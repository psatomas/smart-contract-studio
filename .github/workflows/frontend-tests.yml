name: Frontend Tests

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend/platform_ui
        run: |
          npm ci || npm install

      - name: Run frontend tests
        working-directory: frontend/platform_ui
        run: |
          npm test
