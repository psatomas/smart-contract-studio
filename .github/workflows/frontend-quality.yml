name: Frontend Quality Checks

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-quality.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/platform_ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/platform_ui/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check (tsc)
        run: npx tsc --noEmit || true

      - name: Run ESLint
        run: npm run lint || true

      - name: Build
        run: npm run build || true