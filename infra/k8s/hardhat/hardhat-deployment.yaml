apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardhat-deployment
  labels:
    app: hardhat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hardhat
  template:
    metadata:
      labels:
        app: hardhat
    spec:
      containers:
        - name: hardhat
          image: hardhat:latest
          imagePullPolicy: Never
          command: ["npx", "hardhat", "node"]
          ports:
            - containerPort: 8545
